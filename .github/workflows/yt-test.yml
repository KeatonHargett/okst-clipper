name: yt-download-test
on:
  workflow_dispatch:
    inputs:
      url: { default: "https://youtu.be/5NbCywpzMvk" }
      section: { default: "114-134" }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        method: [warp-full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -U "yt-dlp[default]"
      - name: Try ${{ matrix.method }}
        run: bash tests/yt_test.sh ${{ matrix.method }} "${{ inputs.url }}" "${{ inputs.section }}" | tee result.txt; grep VERDICT result.txt >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "log-${{ matrix.method }}", path: "yt.log", retention-days: 3 }
