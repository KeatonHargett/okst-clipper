name: okst-scout
# Every 30 minutes, 7 am to midnight Central (GitHub drops or delays some scheduled runs, so run often): find new Oklahoma State posts on TikTok, Instagram, and YouTube
# (cloud/scout.json lists the sources) and queue an okst-repost auto run for each. No daily cap.
on:
  schedule:
    - cron: "13,43 13-23,0-5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: okst-scout, cancel-in-progress: false }
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Doppler CLI (retries; dopplerhq/cli-action timed out at 30 s)
        run: bash cloud/install_doppler.sh
      - run: pip install -q -U "yt-dlp[default,curl-cffi]"
      - name: Cloudflare WARP (TikTok and YouTube block cloud IPs)
        run: bash cloud/setup_warp.sh
      - name: Find new posts
        id: find
        run: |
          doppler run -p okst -c dev -- python cloud/scout.py > queue.txt
          echo "Queued:"; cat queue.txt
          echo "count=$(grep -c . queue.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Save seen list
        run: |
          python3 cloud/save_state.py "scout: seen list" state/scout-seen.json state/pending.jsonl
      - name: Queue repost runs
        if: steps.find.outputs.count != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # "manual" = a link Keaton shared that waited for Instagram's daily limit: it ships without the auto judgment.
          while IFS=$'\t' read -r url mode; do
            if [ "$mode" = manual ]; then gh workflow run okst-repost.yml -f url="$url"; else gh workflow run okst-repost.yml -f url="$url" -f auto=true; fi
            sleep 2
          done < queue.txt
