name: bar-relay
# Relay for the "Post to Bar" iPhone Shortcut. The Shortcut's token only reaches this repo, so this tiny job forwards
# the link to the private bar-meme-cards repo's bar-repost workflow with a token kept in Doppler okst/dev
# (GH_DISPATCH_TOKEN). Nothing is downloaded or posted here.
on:
  workflow_dispatch:
    inputs:
      url: { description: "TikTok, Instagram, X, or YouTube link", required: true }
      bar:
        description: "Which bar's pages"
        required: true
        type: choice
        options: [jrmurphys, outlaws, coney, wormydog, willies]
      handle: { description: "Creator @handle (optional)", required: false, default: "" }
      hold: { description: "Make it but do not post", type: boolean, default: false }
permissions: { contents: read }
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      URL: ${{ inputs.url }}
      BAR: ${{ inputs.bar }}
      HANDLE: ${{ inputs.handle }}
      HOLD: ${{ inputs.hold }}
    steps:
      - uses: actions/checkout@v4
      - name: Doppler CLI (retries; dopplerhq/cli-action timed out at 30 s)
        run: bash cloud/install_doppler.sh
      - name: Forward to bar-meme-cards / bar-repost
        run: |
          tok=$(doppler secrets get GH_DISPATCH_TOKEN --plain)
          [ -n "$tok" ] || { echo "::error::GH_DISPATCH_TOKEN is empty in Doppler okst/dev"; exit 1; }
          echo "::add-mask::$tok"
          body=$(python3 -c 'import json,os;print(json.dumps({"ref":"main","inputs":{"url":os.environ["URL"],"bar":os.environ["BAR"],"handle":os.environ["HANDLE"],"hold":os.environ["HOLD"]=="true"}}))')
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $tok" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KeatonHargett/bar-meme-cards/actions/workflows/bar-repost.yml/dispatches -d "$body")
          echo "GitHub answered HTTP $code"
          [ "$code" = "204" ] || { cat /tmp/resp.txt; echo "::error::dispatch failed (HTTP $code)"; exit 1; }
          echo "Forwarded $URL to bar-repost for $BAR. Watch https://github.com/KeatonHargett/bar-meme-cards/actions"
