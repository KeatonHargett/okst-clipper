name: okst-repost
# Started by the "Post to OKST" share sheet Shortcut, by okst-scout (auto=true), or Actions > okst-repost > Run workflow.
on:
  workflow_dispatch:
    inputs:
      url: { description: "TikTok, Instagram, X, or YouTube link", required: true }
      handle: { description: "Creator @handle (optional)", required: false, default: "" }
      hold: { description: "Make it but do not post", type: boolean, default: false }
      auto: { description: "Found by okst-scout: post only if it matches Keaton's taste, skip quietly otherwise", type: boolean, default: false }
      highlight: { description: "Sent by okst-highlights: a network or league clip of an OSU play", type: boolean, default: false }
      game: { description: "With highlight: <sport>:<ESPN event id>", required: false, default: "" }
permissions:
  contents: write
  issues: write
# One group per link: different links run side by side (a shared group cancels queued runs past the first).
concurrency: { group: "okst-repost-${{ inputs.url }}", cancel-in-progress: false }
jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      RAW_URL: ${{ inputs.url }}
      HANDLE: ${{ inputs.handle }}
      HIGHLIGHT: ${{ inputs.highlight }}
      GAME: ${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean the link and check for a repeat
        id: link
        run: |
          python3 - <<'PY'
          import os, re, json, pathlib
          raw = os.environ["RAW_URL"].strip()
          m = re.search(r"https?://\S+", raw)          # share sheets sometimes send "caption text https://..."
          url = m.group(0) if m else raw
          host = re.sub(r"^https?://(www\.|m\.|vm\.|mobile\.)?", "", url).split("/")[0].lower()
          if any(h in host for h in ("instagram.com", "x.com", "twitter.com", "tiktok.com")):
              url = url.split("?")[0].split("#")[0]
          platform = ("instagram" if "instagram" in host else "x" if host in ("x.com", "twitter.com") else
                      "tiktok" if "tiktok" in host else "youtube" if "youtu" in host else "other")
          log = pathlib.Path("state/reposted.jsonl")
          seen = log.exists() and any(json.loads(l).get("url") == url for l in log.read_text().splitlines() if l.strip())
          off = False
          if os.environ.get("HIGHLIGHT") == "true":      # okst-highlights kill switch (state/highlights_off on main)
              import subprocess
              off = subprocess.run(["python3", "cloud/games.py", "switch"]).returncode != 0
              hl = pathlib.Path("state/highlights-log.jsonl")
              seen = seen or (hl.exists() and any(json.loads(l).get("source") == url for l in hl.read_text().splitlines() if l.strip()))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CLEAN_URL={url}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"url={url}\nplatform={platform}\nrepeat={'true' if (seen or off or platform == 'other') else 'false'}\n"
                      f"off={'true' if off else 'false'}\n")
          print(url, platform, "REPEAT" if seen else "new")
          PY
      - name: Already posted
        if: steps.link.outputs.repeat == 'true'
        run: |
          mkdir -p out
          if [ "${{ steps.link.outputs.off }}" = "true" ]; then msg="okst-highlights is switched off (state/highlights_off), so this highlight was not posted"
          elif [ "${{ steps.link.outputs.platform }}" = "other" ]; then msg="not a TikTok, Instagram, X, or YouTube link, so nothing ran (Shortcut test?)"; else msg="this link is already in state/reposted.jsonl, so it was not posted again"; fi
          echo "Skipped: $CLEAN_URL" > out/title.txt
          printf '**Held:** %s.\n\n%s\n' "$msg" "$CLEAN_URL" > out/report.md
      - uses: actions/setup-python@v5
        if: steps.link.outputs.repeat != 'true'
        with: { python-version: "3.12" }
      - uses: dopplerhq/cli-action@v3
        if: steps.link.outputs.repeat != 'true'
      - name: Whisper model cache
        if: steps.link.outputs.repeat != 'true'
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - name: Tools
        if: steps.link.outputs.repeat != 'true'
        run: |
          WANT_EMOJI=1 bash cloud/install_media_tools.sh
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb >/dev/null
          pip install -q -U "yt-dlp[default,curl-cffi]" faster-whisper pillow pillow-heif numpy
          npm install -g -s @anthropic-ai/claude-code
          which google-chrome
      - name: Mask secrets and load the Claude token
        if: steps.link.outputs.repeat != 'true'
        run: |
          doppler secrets download -p okst -c dev --no-file --format json \
            | python -c "import sys,json;[print('::add-mask::'+l) for v in json.load(sys.stdin).values() for l in str(v).splitlines() if len(l)>5]"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$(doppler secrets get CLAUDE_CODE_OAUTH_TOKEN -p okst -c dev --plain)" >> "$GITHUB_ENV"
      - name: Cloudflare WARP (TikTok and YouTube block cloud IPs)
        if: steps.link.outputs.repeat != 'true' && (steps.link.outputs.platform == 'tiktok' || steps.link.outputs.platform == 'youtube')
        run: bash cloud/setup_warp.sh
      - name: Game facts for a highlight (ESPN)
        if: steps.link.outputs.repeat != 'true' && inputs.highlight
        run: python3 cloud/games.py facts --event "${GAME#*:}" --sport "${GAME%%:*}" --out out/facts.json
      - name: Repost (Claude)
        if: steps.link.outputs.repeat != 'true'
        run: |
          mkdir -p out
          args="$CLEAN_URL"
          [ -n "$HANDLE" ] && args="$args @${HANDLE#@}"
          [ "${{ inputs.hold }}" = "true" ] && args="$args hold"
          [ "${{ inputs.auto }}" = "true" ] && args="$args auto"
          [ "${{ inputs.highlight }}" = "true" ] && args="$args highlight=$GAME"
          claude -p "/okst-repost-cloud $args" \
            --permission-mode bypassPermissions --disallowedTools "mcp__claude_ai_AApify" --model claude-opus-5-5 \
            --output-format stream-json --verbose > "$RUNNER_TEMP/claude.jsonl" 2> "$RUNNER_TEMP/claude.err" || echo "claude exited $?"
          python -c "import json,sys;r=[json.loads(l) for l in open(sys.argv[1]) if l.strip()];f=[x for x in r if x.get('type')=='result'];print(f[-1].get('result','')[:3000] if f else 'no result')" "$RUNNER_TEMP/claude.jsonl"
      - name: Copyright stop (highlights)
        if: always() && inputs.highlight
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -f out/copyright_stop ]; then
            echo "$(date -u +%FT%TZ) copyright or rights error on highlight repost $CLEAN_URL: $(head -c 400 out/copyright_stop)" > state/highlights_off
            printf '**okst-highlights switched itself OFF** after a copyright or rights error on %s. Nothing will be retried.\n\n```\n%s\n```\n\nTo turn it back on: Actions > okst-highlights-switch > Run workflow > on.\n' "$CLEAN_URL" "$(cat out/copyright_stop)" > out/copyright.md
            python3 cloud/post_issues.py --title "okst-highlights OFF: copyright or rights error ($GAME)" --body-file out/copyright.md
          fi
      - name: Upload files
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: okst-repost, path: out/, retention-days: 30 }
      - name: Report issue
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out
          [ -s out/report.md ] || echo "**No report written.** Check the run log." > out/report.md
          printf '\n\n[Run and files](%s/%s/actions/runs/%s)\n' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" >> out/report.md
          title=$(head -n1 out/title.txt 2>/dev/null || true)
          if [ "${{ inputs.auto }}" = "true" ] && { [ "${title#Skipped}" != "$title" ] || [ "${title#Waiting}" != "$title" ]; }; then
            # Auto runs that do not post stay quiet: one line in state/scout-skips.jsonl instead of an issue.
            python3 -c "import json,sys,datetime;print(json.dumps({'date':datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M'),'url':sys.argv[1],'why':sys.argv[2]}))" "$CLEAN_URL" "$title" >> state/scout-skips.jsonl
            echo "auto skip logged: $title"
          elif [ "${{ inputs.highlight }}" = "true" ]; then
            set -- ; for c in out/*/*.cover.jpg; do [ -f "$c" ] && set -- "$@" --image "$c"; done
            python3 cloud/post_issues.py --title "Highlight repost: ${title:-$CLEAN_URL}" --body-file out/report.md --prefix "${GAME#*:}" "$@"
          else
            gh issue create --title "Repost: ${title:-$CLEAN_URL}" --body-file out/report.md
          fi
      - name: Save the repost log
        if: always()
        # Replays this run's lines on the latest main (parallel runs used to conflict here and fail).
        run: |
          python3 cloud/save_state.py "repost: $CLEAN_URL" state/reposted.jsonl state/scout-skips.jsonl state/pending.jsonl \
            state/highlights-log.jsonl state/highlights_off
