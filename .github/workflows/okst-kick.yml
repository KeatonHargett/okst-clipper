name: okst-kick
# Free timer for okst-scout (GitHub's own cron has not been firing on this repo).
# Each run queues the next kick run first, then starts okst-scout every 30 min from 7 am to 11 pm Central.
# Runs chain: the queued run starts when this one ends, so the timer keeps itself alive.
# A watchdog runs every 6 hours and restarts the chain if nothing is queued or running.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      loops: { description: "Scout starts in this run (30 min apart)", default: "12" }
      chain: { description: "Queue the next kick run first", type: boolean, default: true }
permissions:
  actions: write
  contents: read
concurrency:
  group: okst-kick-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart the chain if it stopped
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          active=0
          for s in queued in_progress; do
            n=$(gh api "repos/$REPO/actions/workflows/okst-kick.yml/runs?status=$s&event=workflow_dispatch" -q .total_count)
            active=$((active + n))
          done
          if [ "$active" -eq 0 ]; then gh workflow run okst-kick.yml && echo "chain was stopped, restarted"; else echo "chain alive ($active queued or running)"; fi
  kick:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Queue the next kick run
        if: ${{ inputs.chain }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run okst-kick.yml && echo "next kick run queued"
      - name: Start the scout every 30 minutes (7 am to 11 pm Central)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 "${{ inputs.loops }}"); do
            h=$(TZ=America/Chicago date +%H)
            if [ "$((10#$h))" -ge 7 ] && [ "$((10#$h))" -le 23 ]; then
              gh workflow run okst-scout.yml && echo "$(TZ=America/Chicago date +%H:%M) scout started"
            else
              echo "$(TZ=America/Chicago date +%H:%M) quiet hours, skipped"
            fi
            if [ "$i" -lt "${{ inputs.loops }}" ]; then sleep 1800; fi
          done
