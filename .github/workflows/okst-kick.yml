name: okst-kick
# Free timer for okst-scout (GitHub's own cron has not been firing on this repo).
# Each run queues the next kick run first, then starts okst-scout every 30 min from 7 am to 11 pm Central.
# The same loop also starts okst-watch from 9 am to midnight Central, at most once per 30 min
# (okst-watch's own cron stays as a backup and counts toward that limit).
# Every loop, any hour, it also starts okst-highlights for an Oklahoma State game that is about to start, live, or just
# ended (cloud/games.py due), once per game.
# Runs chain: the queued run starts when this one ends, so the timer keeps itself alive.
# A watchdog runs every 6 hours and restarts the chain if nothing is queued or running.
# From 11 am to 7 pm Central each loop also starts bar-meme-cards/bar-meme-post (mode post) through GH_DISPATCH_TOKEN in
# Doppler okst/dev, because GitHub's cron on that private repo fires only every 4 to 10 hours and its bars' slots
# (Coney 11:30, Murphy's 16:00, Outlaws 17:00, each good for 3 hours) kept falling between runs.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      loops: { description: "Scout starts in this run (30 min apart)", default: "12" }
      chain: { description: "Queue the next kick run first", type: boolean, default: true }
permissions:
  actions: write
  contents: read
concurrency:
  group: okst-kick-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart the chain if it stopped
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", REPO: "${{ github.repository }}" }
        run: |
          active=0
          for s in queued in_progress; do
            n=$(gh api "repos/$REPO/actions/workflows/okst-kick.yml/runs?status=$s&event=workflow_dispatch" -q .total_count)
            active=$((active + n))
          done
          if [ "$active" -eq 0 ]; then gh workflow run okst-kick.yml && echo "chain was stopped, restarted"; else echo "chain alive ($active queued or running)"; fi
  kick:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Doppler CLI (for the bar-meme-post dispatch token)
        env: { DOPPLER_TOKEN: "${{ secrets.DOPPLER_TOKEN }}" }
        run: bash cloud/install_doppler.sh || echo "::warning::Doppler install failed, bar posts will not be kicked this run"
      - name: Queue the next kick run
        if: ${{ inputs.chain }}
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: gh workflow run okst-kick.yml && echo "next kick run queued"
      - name: Start the scout every 30 minutes (7 am to 11 pm Central), the watch (9 am to midnight Central) and the bar posts (11 am to 7 pm Central)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", DOPPLER_TOKEN: "${{ secrets.DOPPLER_TOKEN }}" }
        run: |
          BAR_TOK=$(doppler secrets get GH_DISPATCH_TOKEN --plain 2>/dev/null || true)
          if [ -n "$BAR_TOK" ]; then echo "::add-mask::$BAR_TOK"; else echo "::warning::GH_DISPATCH_TOKEN not readable, bar posts will not be kicked this run"; fi
          start_bar_posts() {
            # bar-meme-cards/bar-meme-post, mode post: it publishes only when a bar's slot is due, so an extra start is cheap
            # (under a minute of that private repo's Actions minutes). Skip when a run started in the last 25 minutes.
            [ -n "$BAR_TOK" ] || return 0
            local api="https://api.github.com/repos/KeatonHargett/bar-meme-cards/actions/workflows/bar-meme-post.yml"
            local hdr=(-H "Authorization: Bearer $BAR_TOK" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
            local created age code
            created=$(curl -sf "${hdr[@]}" "$api/runs?per_page=1" | python3 -c 'import sys,json;r=json.load(sys.stdin)["workflow_runs"];print(r[0]["created_at"] if r else "")') || created=""
            if [ -n "$created" ]; then
              age=$(( $(date +%s) - $(date -d "$created" +%s) ))
              if [ "$age" -lt 1500 ]; then echo "$(TZ=America/Chicago date +%H:%M) bar posts skipped, last run started $((age / 60)) min ago"; return 0; fi
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${hdr[@]}" "$api/dispatches" -d '{"ref":"main","inputs":{"mode":"post"}}')
            if [ "$code" = "204" ]; then echo "$(TZ=America/Chicago date +%H:%M) bar posts started"; else echo "::warning::bar posts start failed (HTTP $code)"; fi
          }
          start_watch() {
            # At most one okst-watch start per 30 minutes, counting its own cron runs and any other kick run.
            local last created status age
            last=$(gh api "repos/$GH_REPO/actions/workflows/okst-watch.yml/runs?per_page=1" \
              -q '.workflow_runs[0] | "\(.created_at) \(.status)"') || { echo "::warning::could not read okst-watch runs, watch skipped"; return 0; }
            created=${last%% *}; status=${last#* }
            if [ -n "$created" ] && [ "$created" != "null" ]; then
              age=$(( $(date +%s) - $(date -d "$created" +%s) ))
              if [ "$age" -lt 1800 ]; then echo "$(TZ=America/Chicago date +%H:%M) watch skipped, last run started $((age / 60)) min ago"; return 0; fi
              case "$status" in queued|pending|waiting|requested) echo "$(TZ=America/Chicago date +%H:%M) watch skipped, a run is already waiting"; return 0 ;; esac
            fi
            if gh workflow run okst-watch.yml; then echo "$(TZ=America/Chicago date +%H:%M) watch started"; else echo "::warning::watch start failed"; fi
          }
          start_highlights() {
            # One okst-highlights run per game: skip any game whose event id is already in a run's title.
            local due titles sport event
            git fetch -q origin main && git reset -q --hard origin/main || true      # current config
            due=$(python3 cloud/games.py due) || { echo "::warning::could not read ESPN schedules, highlights skipped"; return 0; }
            [ -n "$due" ] || return 0
            titles=$(gh api "repos/$GH_REPO/actions/workflows/okst-highlights.yml/runs?per_page=100" \
              -q '.workflow_runs[].display_title') || { echo "::warning::could not read okst-highlights runs"; return 0; }
            while read -r sport event; do
              [ -n "$event" ] || continue
              if echo "$titles" | grep -qw -- "$event"; then continue; fi
              if gh workflow run okst-highlights.yml -f event="$event" -f sport="$sport"; then
                echo "$(TZ=America/Chicago date +%H:%M) highlights started for $sport $event"
              else
                echo "::warning::highlights start failed for $sport $event"
              fi
            done <<< "$due"
          }
          for i in $(seq 1 "${{ inputs.loops }}"); do
            start_highlights
            h=$((10#$(TZ=America/Chicago date +%H)))
            if [ "$h" -ge 7 ] && [ "$h" -le 23 ]; then
              if gh workflow run okst-scout.yml; then echo "$(TZ=America/Chicago date +%H:%M) scout started"; else echo "::warning::scout start failed"; fi
            else
              echo "$(TZ=America/Chicago date +%H:%M) quiet hours, skipped"
            fi
            if [ "$h" -ge 9 ]; then start_watch; fi
            if [ "$h" -ge 11 ] && [ "$h" -le 19 ]; then start_bar_posts; fi
            if [ "$i" -lt "${{ inputs.loops }}" ]; then sleep 1800; fi
          done
