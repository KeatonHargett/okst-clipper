name: okst-clip
on:
  workflow_dispatch:
    inputs:
      url: { description: "YouTube URL", required: true }
      hold: { description: "Make clips but do not post", type: boolean, default: false }
permissions:
  contents: write
  issues: write
concurrency: { group: okst-clip, cancel-in-progress: false }
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OKST_FULL_SOURCE: "1"
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Doppler CLI (retries; dopplerhq/cli-action timed out at 30 s)
        run: bash cloud/install_doppler.sh
      - name: Tools
        run: |
          bash cloud/install_media_tools.sh
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb >/dev/null
          pip install -q -U "yt-dlp[default]" faster-whisper opencv-python-headless pillow numpy
          npm install -g -s @anthropic-ai/claude-code
      - name: Mask secrets and load the Claude token
        run: bash cloud/load_claude_token.sh
      - name: Cloudflare WARP for YouTube
        run: bash cloud/setup_warp.sh
      - name: Download the full video
        run: |
          id=$(python -m yt_dlp --print id "${{ inputs.url }}")
          mkdir -p "chopify/work/$id"
          python -m yt_dlp -f "bestvideo*+bestaudio/best" -S "vcodec:h264,res:1080,acodec:m4a" -N 4 \
            --merge-output-format mp4 --no-playlist -o "chopify/work/$id/source.%(ext)s" "${{ inputs.url }}"
          ls -la "chopify/work/$id"
      - name: Clip and ship (Claude)
        run: |
          mkdir -p out
          claude -p "/okst-clip-cloud ${{ inputs.url }}${{ inputs.hold && ' hold' || '' }}" \
            --permission-mode bypassPermissions --disallowedTools "mcp__claude_ai_AApify" --model claude-opus-5-5 \
            --output-format stream-json --verbose > "$RUNNER_TEMP/claude.jsonl" 2> "$RUNNER_TEMP/claude.err" || rc=$?
          echo "claude exited ${rc:-0}"
          python3 cloud/claude_result.py "$RUNNER_TEMP/claude.jsonl" "$RUNNER_TEMP/claude.err" "${rc:-0}"
      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: okst-clips, path: out/, retention-days: 30 }
      - name: Report issue
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -s out/report.md ] || echo "**No report written.** Check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > out/report.md
          printf '\n\n[Run and clip files](%s/%s/actions/runs/%s)\n' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" >> out/report.md
          title=$(python -m yt_dlp --skip-download --print title "${{ inputs.url }}" 2>/dev/null || echo "${{ inputs.url }}")
          gh issue create --title "OKST: $title" --body-file out/report.md
      - name: Save post log and corrections
        if: always()
        run: |
          python3 cloud/save_state.py "clip: post log for ${{ inputs.url }}" state/posted-log.jsonl chopify/okst_clip.py
